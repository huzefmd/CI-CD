
name: Automate deployment

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/CI-CD
            git pull origin main
            npm install

            if pm2 describe CI-CD-App >  /dev/null 2>&1; then 
              pm2 restart CI-CD-App
            else 
             pm2 start npm --name "CI-CD-App" -- start
            fi
            pm2 save
